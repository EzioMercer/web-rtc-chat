name: Check Nostr relays

# Checks that the public relays accept and forward the app's signaling events.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [scripts/**, .github/workflows/relay-check.yml, src/nostr/**, src/signaling/**]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-relays.mjs

  e2e:
    # Playwright's browsers don't support the newest Ubuntu image yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node scripts/check-turn.mjs
      - run: npm run build
      - run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          sleep 3
          node scripts/e2e-real-relays.mjs
