name: Check Nostr relays

# Checks that the public relays accept and forward the app's signaling events.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [scripts/**, .github/workflows/relay-check.yml, src/core/nostr/**, src/core/signaling/**]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-relays.mjs

  e2e:
    # Playwright's browsers don't support the newest Ubuntu image yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The real-relay test opens Chromium, Firefox and WebKit.
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/check-turn.mjs
      - run: npm run build
      # On 127.0.0.1, where the test opens the app: "localhost" can be IPv6 only on the runner. The test starts once
      # the server answers.
      - run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4173/web-rtc-chat/ > /dev/null && break; sleep 1; done
          node scripts/e2e-real-relays.mjs
      - if: failure()
        run: cat preview.log
