<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="description" content="Private chat, calls and file sharing directly between two browsers. No account, no server in the middle, nothing stored.">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>P2P WebRTC Chat</title>
  <!-- Link previews: Open Graph is read by Facebook, WhatsApp, Telegram, Reddit, LinkedIn, Discord, Slack;
       X reads twitter:card and falls back to the og: tags for the rest. Image URLs must be absolute. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="P2P WebRTC Chat">
  <meta property="og:title" content="P2P WebRTC Chat">
  <meta property="og:description" content="Private chat, calls and file sharing directly between two browsers. No account, no server in the middle, nothing stored.">
  <meta property="og:url" content="https://eziomercer.github.io/web-rtc-chat/">
  <meta property="og:image" content="https://eziomercer.github.io/web-rtc-chat/og-image.jpg?v=2">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="P2P WebRTC Chat logo: a shield split in two halves with five linked dots">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
