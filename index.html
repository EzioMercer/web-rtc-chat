<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P WebRTC Chat</title>
  <script defer type="module" src="./src/index.ts"></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="title">P2P Chat</h1>
      <span id="status" class="status" data-state="idle">Not connected</span>
    </header>

    <section id="setup" class="card setup">
      <ol class="steps">
        <li><b>To host:</b> leave the first field empty and press <i>Host</i>. Send your code to the peer, then paste their reply into the first field and press <i>Connect</i>.</li>
        <li><b>To join:</b> paste the host's code into the first field and press <i>Join</i>. Send your code back to the host.</li>
      </ol>

      <label class="field">
        <span class="field-label">Peer's code</span>
        <textarea id="peer-code" spellcheck="false" placeholder="Leave empty to host, or paste the code you received…"></textarea>
      </label>

      <button id="action-btn" class="btn btn-primary" type="button">Host</button>

      <label class="field">
        <span class="field-label">
          Your code
          <button id="copy-btn" class="btn btn-ghost" type="button" disabled>Copy</button>
        </span>
        <textarea id="my-code" readonly spellcheck="false" placeholder="Your code will appear here…"></textarea>
      </label>

      <p id="hint" class="hint"></p>
    </section>

    <section id="chat" class="card chat" hidden>
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="composer">
        <input id="msg-input" type="text" placeholder="Type a message…" autocomplete="off" />
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </section>
  </main>
</body>
</html>
